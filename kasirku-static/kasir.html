<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir POS - KasirKu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #1f1d2b;
            --bg-card: #252836;
            --bg-input: #2d303e;
            --primary: #ea7c69;
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }
        
        .navbar-custom {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }
        
        .pos-container {
            display: flex;
            height: calc(100vh - 73px);
        }
        
        .products-panel {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }
        
        .cart-panel {
            width: 400px;
            background-color: var(--bg-card);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        
        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .product-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .product-icon {
            width: 50px;
            height: 50px;
            background-color: rgba(234, 124, 105, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.75rem;
            color: var(--primary);
            font-size: 1.5rem;
        }
        
        .product-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }
        
        .product-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
        }
        
        .product-stock {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
        }
        
        .cart-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .form-control, .form-select {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: #fff;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: var(--bg-input);
            border-color: var(--primary);
            color: #fff;
        }
        
        .btn-checkout {
            background-color: var(--primary);
            border: none;
            color: white;
            font-weight: 700;
            padding: 1rem;
            border-radius: 12px;
            width: 100%;
        }
        
        .btn-checkout:hover {
            background-color: #e06550;
            color: white;
        }
        
        .btn-logout {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar-custom">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-shop" style="font-size: 1.5rem; color: var(--primary);"></i>
                    <span class="fw-bold fs-5">KasirKu POS</span>
                </div>
                <span class="badge" style="background-color: rgba(168, 85, 247, 0.2); color: #a855f7; padding: 0.4rem 0.8rem; border-radius: 8px;">Kasir</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="text-end">
                    <p class="mb-0 fw-semibold" style="font-size: 0.9rem;" id="userName">Loading...</p>
                    <p class="mb-0" style="font-size: 0.75rem; color: var(--text-muted);">Kasir</p>
                </div>
                <button class="btn btn-logout" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <div class="pos-container">
        <!-- Products Panel -->
        <div class="products-panel">
            <div class="mb-4">
                <input type="text" id="searchProduct" class="form-control" placeholder="Cari produk berdasarkan nama atau kode..." onkeyup="searchProducts()">
            </div>
            
            <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" id="productsGrid">
                <!-- Dynamic products -->
            </div>
        </div>

        <!-- Cart Panel -->
        <div class="cart-panel">
            <div class="p-3 border-bottom" style="border-color: var(--border-color) !important;">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold">Keranjang</h5>
                    <button class="btn btn-sm btn-outline-danger" onclick="clearCart()">
                        <i class="bi bi-trash"></i> Kosongkan
                    </button>
                </div>
            </div>

            <div class="flex-grow-1 overflow-auto" id="cartItems">
                <!-- Dynamic cart items -->
            </div>

            <div class="p-3 border-top" style="border-color: var(--border-color) !important;">
                <div class="d-flex justify-content-between mb-2">
                    <span style="color: var(--text-muted);">Subtotal</span>
                    <span class="fw-bold" id="cartSubtotal">Rp 0</span>
                </div>
                <div class="d-flex justify-content-between mb-3 pb-3 border-bottom" style="border-color: var(--border-color) !important;">
                    <span class="fw-bold">Total</span>
                    <span class="fw-bold fs-5" style="color: var(--primary);" id="cartTotal">Rp 0</span>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size: 0.85rem;">Metode Pembayaran</label>
                    <select class="form-select" id="paymentMethod">
                        <option value="cash">Tunai</option>
                        <option value="qris">QRIS</option>
                        <option value="debit">Kartu Debit</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size: 0.85rem;">Jumlah Bayar</label>
                    <input type="number" class="form-control" id="paidAmount" placeholder="0">
                </div>

                <button class="btn btn-checkout" onclick="checkout()">
                    <i class="bi bi-check-circle me-2"></i>Proses Pembayaran
                </button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/kasir.js"></script>
</body>
</html>
