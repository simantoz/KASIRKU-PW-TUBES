<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Owner - KasirKu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-main: #1f1d2b;
            --bg-card: #252836;
            --bg-input: #2d303e;
            --primary: #ea7c69;
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
        }
        
        .navbar-custom {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }
        
        .stat-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .chart-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
        }
        
        table {
            color: var(--text-main);
        }
        
        table thead {
            background-color: var(--bg-input);
        }
        
        table tbody tr {
            border-bottom: 1px solid var(--border-color);
        }
        
        .btn-logout {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .btn-logout:hover {
            background-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
    </style>
</head>
<body>
    <nav class="navbar-custom">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-shop" style="font-size: 1.5rem; color: var(--primary);"></i>
                    <span class="fw-bold fs-5">KasirKu</span>
                </div>
                <span class="badge" style="background-color: rgba(234, 124, 105, 0.2); color: var(--primary); padding: 0.4rem 0.8rem; border-radius: 8px;">Owner</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="text-end">
                    <p class="mb-0 fw-semibold" style="font-size: 0.9rem;" id="userName">Loading...</p>
                    <p class="mb-0" style="font-size: 0.75rem; color: var(--text-muted);">Administrator</p>
                </div>
                <button class="btn btn-logout" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div class="stat-icon" style="background-color: rgba(34, 197, 94, 0.2); color: #22c55e;">
                            <i class="bi bi-cash-stack"></i>
                        </div>
                    </div>
                    <p class="mb-1" style="color: var(--text-muted); font-size: 0.85rem;">Total Pendapatan</p>
                    <h4 class="fw-bold mb-0" id="totalRevenue">Rp 0</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div class="stat-icon" style="background-color: rgba(234, 124, 105, 0.2); color: var(--primary);">
                            <i class="bi bi-graph-up-arrow"></i>
                        </div>
                    </div>
                    <p class="mb-1" style="color: var(--text-muted); font-size: 0.85rem;">Total Keuntungan</p>
                    <h4 class="fw-bold mb-0" id="totalProfit">Rp 0</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div class="stat-icon" style="background-color: rgba(59, 130, 246, 0.2); color: #3b82f6;">
                            <i class="bi bi-receipt"></i>
                        </div>
                    </div>
                    <p class="mb-1" style="color: var(--text-muted); font-size: 0.85rem;">Total Transaksi</p>
                    <h4 class="fw-bold mb-0" id="totalTransactions">0</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div class="stat-icon" style="background-color: rgba(168, 85, 247, 0.2); color: #a855f7;">
                            <i class="bi bi-box-seam"></i>
                        </div>
                    </div>
                    <p class="mb-1" style="color: var(--text-muted); font-size: 0.85rem;">Produk Terjual</p>
                    <h4 class="fw-bold mb-0" id="totalProductsSold">0</h4>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-8">
                <div class="chart-card">
                    <h5 class="fw-bold mb-3">Grafik Pendapatan (5 Hari Terakhir)</h5>
                    <div style="height: 300px;">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="chart-card">
                    <h5 class="fw-bold mb-3">
                        <i class="bi bi-exclamation-triangle-fill me-2" style="color: #f87171;"></i>
                        Peringatan Stok Rendah
                    </h5>
                    <div id="lowStockAlerts" style="max-height: 300px; overflow-y: auto;">
                        <!-- Dynamic content -->
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-12">
                <div class="chart-card">
                    <h5 class="fw-bold mb-3">Top 5 Produk Terlaris</h5>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th class="px-4 py-3" style="color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">No</th>
                                    <th class="px-4 py-3" style="color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">Nama Produk</th>
                                    <th class="px-4 py-3 text-center" style="color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">Terjual</th>
                                    <th class="px-4 py-3 text-end" style="color: var(--text-muted); font-weight: 600; font-size: 0.85rem;">Pendapatan</th>
                                </tr>
                            </thead>
                            <tbody id="topProductsTable">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/owner.js"></script>
</body>
</html>
