<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - KasirKu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #1f1d2b;
            --bg-card: #252836;
            --bg-input: #2d303e;
            --primary: #ea7c69;
            --primary-hover: #e06550;
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 460px;
            width: 100%;
            padding: 2.5rem;
        }

        .brand-badge {
            width: 60px;
            height: 60px;
            background: rgba(234, 124, 105, 0.2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.8rem;
            margin: 0 auto 1.25rem;
        }

        .form-control {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 12px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            background-color: var(--bg-input);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 0 3px rgba(234, 124, 105, 0.25);
        }

        .input-group-text {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .btn-submit {
            background-color: var(--primary);
            border: none;
            color: white;
            font-weight: 700;
            padding: 0.85rem;
            border-radius: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(234, 124, 105, 0.35);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            color: white;
            box-shadow: 0 10px 28px rgba(234, 124, 105, 0.5);
            transform: translateY(-1px);
        }

        .alert-custom {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: none;
            border-radius: 12px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-badge">
            <i class="bi bi-shop"></i>
        </div>
        <h4 class="fw-bold text-center mb-1">KasirKu</h4>
        <p class="text-center mb-4" style="color: var(--text-muted); font-size: 0.88rem;">Masuk ke sistem kasir point of sales</p>

        <div id="errorAlert" class="alert alert-custom py-2 px-3 mb-3 d-none">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span id="errorMessage">Email atau password salah!</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold" style="font-size: 0.82rem; color: var(--text-muted);">Email</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" id="email" class="form-control border-start-0 ps-0" placeholder="nama@kasirku.com" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold" style="font-size: 0.82rem; color: var(--text-muted);">Kata Sandi</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary border-start-0 input-group-text" type="button" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" name="remember" id="remember" style="background-color: var(--bg-input); border-color: var(--border-color);">
                <label class="form-check-label" for="remember" style="font-size: 0.82rem; color: var(--text-muted);">
                    Ingat saya
                </label>
            </div>

            <button type="submit" class="btn btn-submit w-100 d-flex align-items-center justify-content-center gap-2">
                <span>Masuk Sekarang</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="mt-4 pt-3 border-top" style="border-color: var(--border-color) !important;">
            <p class="text-center mb-2" style="color: var(--text-muted); font-size: 0.8rem;">Demo Credentials:</p>
            <div style="font-size: 0.75rem; color: var(--text-muted);">
                <p class="mb-1">👑 Owner: <code style="color: var(--primary);">owner@kasirku.com</code></p>
                <p class="mb-1">📦 Gudang: <code style="color: var(--primary);">gudang@kasirku.com</code></p>
                <p class="mb-0">💰 Kasir: <code style="color: var(--primary);">kasir@kasirku.com</code></p>
                <p class="mt-2 mb-0 text-center">Password: <code style="color: var(--primary);">password</code></p>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        // Handle login
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const success = login(email, password);
            
            if (!success) {
                const errorAlert = document.getElementById('errorAlert');
                errorAlert.classList.remove('d-none');
                setTimeout(() => {
                    errorAlert.classList.add('d-none');
                }, 3000);
            }
        }

        // Check if already logged in
        const currentUser = getCurrentUser();
        if (currentUser) {
            redirectByRole(currentUser.role);
        }
    </script>
</body>
</html>
