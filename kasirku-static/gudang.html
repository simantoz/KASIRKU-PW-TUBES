<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gudang - KasirKu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #1f1d2b;
            --bg-card: #252836;
            --bg-input: #2d303e;
            --primary: #ea7c69;
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
        }
        
        .navbar-custom {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }
        
        .content-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
        }
        
        .form-control, .form-select {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: #fff;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: var(--bg-input);
            border-color: var(--primary);
            color: #fff;
        }
        
        .nav-tabs {
            border-bottom: 1px solid var(--border-color);
        }
        
        .nav-tabs .nav-link {
            color: var(--text-muted);
            border: none;
            border-bottom: 2px solid transparent;
        }
        
        .nav-tabs .nav-link.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: transparent;
        }
        
        table {
            color: var(--text-main);
        }
        
        table thead {
            background-color: var(--bg-input);
        }
        
        table tbody tr {
            border-bottom: 1px solid var(--border-color);
        }
        
        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
        }
        
        .modal-header {
            border-bottom: 1px solid var(--border-color);
        }
        
        .btn-logout {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        
        .btn-primary {
            background-color: var(--primary);
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #e06550;
        }
    </style>
</head>
<body>
    <nav class="navbar-custom">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-shop" style="font-size: 1.5rem; color: var(--primary);"></i>
                    <span class="fw-bold fs-5">KasirKu</span>
                </div>
                <span class="badge" style="background-color: rgba(59, 130, 246, 0.2); color: #3b82f6; padding: 0.4rem 0.8rem; border-radius: 8px;">Gudang</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="text-end">
                    <p class="mb-0 fw-semibold" style="font-size: 0.9rem;" id="userName">Loading...</p>
                    <p class="mb-0" style="font-size: 0.75rem; color: var(--text-muted);">Admin Gudang</p>
                </div>
                <button class="btn btn-logout" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="content-card">
            <ul class="nav nav-tabs mb-4" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="products-tab" data-bs-toggle="tab" data-bs-target="#products" type="button">
                        <i class="bi bi-box-seam me-2"></i>Produk
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="categories-tab" data-bs-toggle="tab" data-bs-target="#categories" type="button">
                        <i class="bi bi-grid-3x3 me-2"></i>Kategori
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Products Tab -->
                <div class="tab-pane fade show active" id="products" role="tabpanel">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="d-flex gap-2">
                            <input type="text" id="searchProduct" class="form-control" placeholder="Cari produk..." style="width: 300px;" onkeyup="searchProducts()">
                            <select id="categoryFilter" class="form-select" style="width: 200px;" onchange="filterByCategory()">
                                <option value="all">Semua Kategori</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" onclick="showAddProductModal()">
                            <i class="bi bi-plus-lg me-2"></i>Tambah Produk
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th class="px-3 py-3" style="font-size: 0.85rem;">Kode</th>
                                    <th class="px-3 py-3" style="font-size: 0.85rem;">Nama Produk</th>
                                    <th class="px-3 py-3" style="font-size: 0.85rem;">Kategori</th>
                                    <th class="px-3 py-3 text-end" style="font-size: 0.85rem;">Harga Beli</th>
                                    <th class="px-3 py-3 text-end" style="font-size: 0.85rem;">Harga Jual</th>
                                    <th class="px-3 py-3 text-center" style="font-size: 0.85rem;">Stok</th>
                                    <th class="px-3 py-3 text-center" style="font-size: 0.85rem;">Status</th>
                                    <th class="px-3 py-3" style="font-size: 0.85rem;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="productsTable">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Categories Tab -->
                <div class="tab-pane fade" id="categories" role="tabpanel">
                    <div class="d-flex justify-content-end mb-4">
                        <button class="btn btn-primary">
                            <i class="bi bi-plus-lg me-2"></i>Tambah Kategori
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th class="px-3 py-3" style="font-size: 0.85rem;">No</th>
                                    <th class="px-3 py-3" style="font-size: 0.85rem;">Nama Kategori</th>
                                    <th class="px-3 py-3" style="font-size: 0.85rem;">Slug</th>
                                    <th class="px-3 py-3" style="font-size: 0.85rem;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="categoriesTable">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah Produk</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm" onsubmit="saveProduct(event)">
                        <div class="mb-3">
                            <label class="form-label">Kode Produk</label>
                            <input type="text" class="form-control" id="productCode" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nama Produk</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kategori</label>
                            <select class="form-select" id="productCategory" required>
                                <!-- Dynamic options -->
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Harga Beli</label>
                                <input type="number" class="form-control" id="productCostPrice" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Harga Jual</label>
                                <input type="number" class="form-control" id="productSellingPrice" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Stok</label>
                                <input type="number" class="form-control" id="productStock" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Min Stok</label>
                                <input type="number" class="form-control" id="productMinStock" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Satuan</label>
                                <input type="text" class="form-control" id="productUnit" placeholder="pcs, bks, btl" required>
                            </div>
                        </div>
                        <div class="d-flex gap-2 justify-content-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-primary">Simpan</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/gudang.js"></script>
</body>
</html>
